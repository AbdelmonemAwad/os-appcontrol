#
# The page's questions, its Apply, and the classifier as a service. errors:no on each script here:
# it prints a JSON answer and exits 0, and this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/appcontrol/status.py
parameters:
errors:no
type:script_output
message:reading what Application Control found

# The connections nDPI did not name, latest first (the plan's "seen").
[unknown]
command:/usr/local/opnsense/scripts/appcontrol/status.py unknown
parameters:
errors:no
type:script_output
message:reading the connections nDPI did not name

# The protocols the installed nDPI knows, for Settings' Application tables (the model's
# JsonKeyValueStoreField asks for them).
[apps]
command:/usr/local/opnsense/scripts/appcontrol/apps.py list
parameters:
errors:no
type:script_output
message:reading the applications nDPI knows

# The aliases made to say what the settings say, the installed nDPI read again first. The page's
# Apply then reloads the filter, so pf holds their tables, and cron, so their Expire runs.
[apply]
command:/usr/local/opnsense/scripts/appcontrol/aliases.php
parameters:
errors:no
type:script_output
message:writing Application Control's aliases

# Every alias of the plugin's taken out - its removal runs it while its files are still there.
[remove]
command:/usr/local/opnsense/scripts/appcontrol/aliases.php --remove
parameters:
errors:no
type:script_output
message:removing Application Control's aliases

# The tables of aliases gone, emptied: a table outlives its alias.
[flush]
command:/usr/local/opnsense/scripts/appcontrol/tables.py flush-gone
parameters:
errors:no
type:script_output
message:emptying the tables of Application Control's aliases gone

# The classifier. The "one" prefix tells rc.subr to do as it is asked: whether it runs is decided by
# the setting in config.xml (plugins.inc.d/appcontrol.inc starts it at boot), not by rc.conf.
[start]
command:/usr/local/etc/rc.d/appcontrol onestart
parameters:
type:script
message:starting the Application Control classifier

[stop]
command:/usr/local/etc/rc.d/appcontrol onestop
parameters:
type:script
message:stopping the Application Control classifier

[restart]
command:/usr/local/etc/rc.d/appcontrol onerestart
parameters:
type:script
message:restarting the Application Control classifier
