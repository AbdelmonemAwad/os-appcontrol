name: checks

# What a change to this plugin has to survive before it can be merged.
#
# Everything here is cheap and deterministic: it parses files and compares them with
# each other, and runs the plugin's scripts with stand-ins for what only a firewall has.
# There is no OPNsense to install on a GitHub runner and no appliance to measure, so this
# does not pretend to measure behaviour on one - it catches the mistakes that have
# actually happened while this plugin's family was being written:
#
#   * a template that no longer compiles, which takes the whole page to the crash
#     reporter and tells the reader nothing;
#   * a shell script or Python file with a syntax error, found after it was installed;
#   * a string added to the page, a form, the model, the menu or a data file and never
#     translated, which shows up as one English sentence in the middle of an Arabic page;
#   * an address from the machine this was written on, left in an example.
#
# And what this plugin adds: the classifier read against ndpiReader's own CSV as the
# phase 0 lab had it, a guess never put in a table, the aliases written through stand-ins
# of OPNsense's Alias model, and the install and removal run in a temporary root.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-releases:
    name: signed releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A release is installed only as its owner signed it (SIGNED RELEASES in self-update.py):
      # what a check takes and refuses, and what an update installs. OpenSSL is the runner's.
      - name: self-update.py takes a release only as signed
        run: python3 tools/test-self-update.py

  classifier:
    name: classifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ndpiReader's CSV as the lab read it (tools/fixtures/lab-*.csv, every address a documentation
      # one), packets built byte by byte, a stand-in pfctl: what is named, guessed or unknown, what
      # goes into a table and what never does, the JA4 of FoxIO's own example, and one run of the
      # service with stand-in tcpdump and ndpiReader programs.
      - name: The classifier, its capture and its tables
        run: python3 tools/test-classify.py

      # The aliases made, their Expire refreshed and taken out on removal, through stand-ins of
      # OPNsense's Alias model; and aliases.php's own run.
      - name: The aliases, through stand-ins of OPNsense's Alias model
        run: php tools/test-aliases.php

      # The page's API: the status passed on, the grids' rows, and Apply's order - the aliases, the
      # filter, cron, the tables of aliases gone, the classifier - with stand-ins for OPNsense's MVC base.
      - name: The page's API
        run: php tools/test-mvc.php

      # install/install.sh copies src/ whole; install/uninstall.sh names what it removes.
      - name: Every file the installer lays down is removed by the uninstaller
        run: sh tools/check-uninstall.sh .

      # The installer, the removal, the package's scripts and place-menu.sh, run in a temporary root
      # with stand-ins for service, configctl, pkg, pfctl and pkill.
      - name: Install, removal and menu, in a temporary root
        run: python3 tools/test-install.py

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.py tools/**/*.py)
          [ ${#files[@]} -gt 0 ] || { echo "no Python here"; exit 0; }
          python3 -m compileall -q "${files[@]}"
          # compileall is the parser; this is the part it does not do - a name used and
          # never defined, an import that is not there. Both have shipped before.
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes "${files[@]}"

      - name: PHP
        run: |
          shopt -s globstar nullglob
          # .inc too: plugins.inc.d's hook is PHP that OPNsense includes, and an error in it stops
          # what includes it; and the test, which is PHP the checks run.
          files=(src/**/*.php src/**/*.inc tools/**/*.php)
          [ ${#files[@]} -gt 0 ] || { echo "no PHP here"; exit 0; }
          for f in "${files[@]}"; do php -l "$f"; done

      - name: XML
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.xml)
          [ ${#files[@]} -gt 0 ] || { echo "no XML here"; exit 0; }
          for f in "${files[@]}"; do
            python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$f"
            echo "ok $f"
          done

      # Well-formed is not enough for one of those files. A comment inside a widget's
      # <translations> element reaches gettext() as a value; two of them reach it as an
      # array, and the TypeError that follows empties every dashboard in the GUI with
      # nothing in any log naming the file.
      - name: Widget metadata
        run: |
          [ -f tools/check-widget-metadata.py ] || { echo "no widget here"; exit 0; }
          python3 tools/check-widget-metadata.py .

      - name: JSON
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.json)
          [ ${#files[@]} -gt 0 ] || { echo "no JSON here"; exit 0; }
          for f in "${files[@]}"; do
            python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$f"
            echo "ok $f"
          done

      - name: Shell
        run: |
          shopt -s globstar nullglob
          # install/ is run by the person installing, src/etc/rc.d is run by the system
          # at boot, pkg/ is run by pkg(8) as root in the middle of an install or a
          # removal, and tools/ is run on the firewall by whoever is building a package.
          # Every one of them is a place where a syntax error is found too late.
          for f in install/*.sh tools/*.sh pkg/*.sh src/etc/rc.d/* src/etc/rc.syshook.d/**/* src/opnsense/scripts/**/*.sh; do
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -q '^#!' || continue
            sh -n "$f" && echo "ok $f"
          done

  privacy:
    name: nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No real addresses, hardware identifiers or credentials
        run: python3 tools/check-private-data.py .
      - name: Every source file carries the copyright line
        run: python3 tools/add-copyright.py

      # Arabic belongs in the catalogue and nowhere else: a sentence written straight
      # into a template cannot be reviewed by somebody who does not read it, cannot be
      # changed without touching code, and is invisible to anything that counts what
      # still needs translating.
      - name: No Arabic outside the translation files
        run: python3 tools/check-code-language.py .

  translations:
    name: translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # nDPI's category names reach the page through a map made from categories.json. A
      # category added there and not to the map comes out in English on an Arabic page,
      # and nothing in the build says so.
      - name: The category map is current
        run: |
          [ -f tools/gen-data-strings.py ] || { echo "not this plugin"; exit 0; }
          python3 tools/gen-data-strings.py --check

      # The page's lang._(), the forms' labels, help and hints, the model's messages and options, the
      # menu, the ACL and the PHP's gettext(): each string OPNsense passes through gettext is in
      # source.json, and has its Arabic in opnsense-arabic.
      - name: Every string the GUI shows is in the catalogue
        # A contributor's pull request (from a fork) and main may carry a string whose Arabic follows
        # later (CONTRIBUTING.md): a warning there; on a branch of this repository a failure, as before.
        env:
          ARABIC_LATER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && '1' || '' }}
        run: |
          [ -f tools/check-strings.py ] || { echo "not this plugin"; exit 0; }
          python3 tools/check-strings.py
